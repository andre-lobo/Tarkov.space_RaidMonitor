name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Prepare asset
        shell: pwsh
        run: Copy-Item "target/release/raid-ip-monitor.exe" "Tarkov.space Raid Monitor.exe"

      - name: Release info
        id: rel
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/',''
            "tag=$tag"          | Out-File $env:GITHUB_OUTPUT -Append
            "name=$tag"         | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "tag=latest"        | Out-File $env:GITHUB_OUTPUT -Append
            "name=Latest build" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Remove old assets from this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.rel.outputs.tag }}"
          $names = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $names) {
            foreach ($n in $names) {
              Write-Host "Deleting old asset: $n"
              gh release delete-asset $tag "$n" -y 2>$null
            }
          } else {
            Write-Host "No existing release/assets to clean."
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          make_latest: true
          files: Tarkov.space Raid Monitor.exe
